<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MASON 浅色 / 深色动态表情</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #111214; color: #f4f4f2; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 32px 20px 56px; }
    main { width: min(960px, 100%); margin: 0 auto; }
    header { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 14px; }
    header span { color: #a9aaad; font-size: 13px; text-align: center; }
    section { border-top: 1px solid #2a2b2e; padding: 18px 0 24px; }
    h2 { margin: 0 0 10px; font-size: 14px; font-weight: 500; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main>
    <header><span>浅色</span><span>深色</span></header>
    <section>
      <h2>斜嘴</h2>
      <img src="mason-stone-light-dark-tilted-mouth-motion-v1.gif" alt="斜嘴动态对比">
    </section>
    <section>
      <h2>X 眼惊讶</h2>
      <img src="mason-stone-light-dark-x-eyes-surprised-motion-v1.gif" alt="X 眼惊讶动态对比">
    </section>
    <section>
      <h2>方眼笑脸</h2>
      <img src="mason-stone-light-dark-square-eye-smile-motion-v1.gif" alt="方眼笑脸动态对比">
    </section>
    <section>
      <h2>皱眉</h2>
      <img src="mason-stone-light-dark-frown-motion-v1.gif" alt="皱眉动态对比">
    </section>
    <section>
      <h2>问号脸</h2>
      <img src="mason-stone-light-dark-question-marks-motion-v1.gif" alt="问号脸动态对比">
    </section>
  </main>
</body>
</html>
